version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  # The Python dependency set: Dependabot reads uv.lock and pyproject.toml.
  # A pull request it opens moves uv.lock alone; the two hash-pinned
  # lockfiles every install reads (requirements.lock, requirements-dev.lock)
  # are regenerated by scripts/freeze_deps.sh in the same pull request, or
  # the gate's `uv.lock is current` step is the only thing that moves.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
