# Supply-chain surveillance over the locked dependency set. Findings are
# reported (job summaries, scan artifacts), not gated — a new upstream
# advisory must not block unrelated pull requests.
name: security

on:
  schedule:
    - cron: "0 7 * * 3"
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  pip-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Audit the locked dependency set
        continue-on-error: true
        run: |
          python -m pip install --quiet pip-audit
          set +e
          python -m pip_audit -r requirements.lock -r requirements-dev.lock --require-hashes 2>&1 | tee audit.txt
          rc="${PIPESTATUS[0]}"
          {
            echo "## pip-audit"
            echo '```'
            cat audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

  osv-scan:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        -L
        requirements.txt:requirements.lock
        -L
        requirements.txt:requirements-dev.lock
      fail-on-vuln: false
      upload-sarif: false

  sbom:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          path: .
          format: spdx-json
          artifact-name: sbom.spdx.json
          upload-artifact-retention: "30"
