# Hermetic pull-request gate: everything below runs from the git-tracked tree
# and the two hash-pinned lockfiles — no network access after the uv.lock
# check and the bootstrap.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PYTHONHASHSEED: "0"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # uv.lock (the lock Dependabot's uv ecosystem reads) must describe the
      # same dependency set as the two hash-pinned lockfiles. uv is installed
      # hash-pinned for this check only; the gate runs from the pip lockfiles.
      - name: uv.lock is current
        run: |
          cat > "${RUNNER_TEMP}/uv-requirements.txt" <<'REQ'
          uv==0.11.26 --hash=sha256:4dcf4e0b5b5cbdc242dcb002f1f8d99e7cf8c043609869228a9ce15e095c0b18 --hash=sha256:c28822517d03aebbe9549aaaecc88ad580e4b2b6a927abffe5774a74d6ba09f6
          REQ
          python -m pip install --quiet --require-hashes -r "${RUNNER_TEMP}/uv-requirements.txt"
          python -m uv lock --check --python 3.12
      - name: Bootstrap (hash-verified lockfiles)
        run: scripts/bootstrap.sh
      - name: PII guard
        run: python3 scripts/check_no_pii.py
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Tests
        run: make test
      - name: Pure-code builders
        run: make vectors fuzz adversarial zip-scf corpus classifier gazetteers context rules
      - name: Schema validation
        run: make schema-check-only
      - name: Hash check (built artifacts only)
        run: make hash-check-built-only
